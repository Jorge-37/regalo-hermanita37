<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FUENTES -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

  <title>Para Ti 💖</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- CONFETI -->
  <canvas id="canvas"></canvas>

  <!-- CONTENIDO -->
  <div class="contenedor">

    <h1 class="titulo">Para Ti <span> 🐱</span></h1>
    

    <!-- CAJA DE REGALO -->
    <div class="caja-wrapper">
      <div class="caja">

        <!-- BASE -->
        <div class="regalos"></div>

        <!-- TAPA (AHORA CONTIENE EL MOÑO) -->
        <div class="regalo">

          <!-- CINTA -->
          <div class="cinta-de-regalo">
            <div class="cinta-de-regalo-izquierda"></div>
            <div class="cinta-de-regalo-derecha"></div>
            <div class="cinta-de-regalo-centro"></div>
          </div>

        </div>

        <!-- ESTRELLAS -->
        <div class="icono-estrella estrella1"></div>
        <div class="icono-estrella estrella2"></div>
        <div class="icono-estrella estrella3"></div>
        <div class="icono-estrella estrella4"></div>
        <div class="icono-estrella estrella5"></div>

      </div>
    </div>

  </div>

  <!-- CARTA -->
  <div class="envoltura-carta" id="cartaWrapper">
    <div class="carta">
      <div class="tapa"></div>

      <div class="contenido">
        <span> para ti beky✨</span>
        <p>
            Queria darte esta sorpresa para tu
             cumple. Me costo mucho tiempo, pero
              me divertí mucho haciéndolo.<br>
              Sabes, haveces las cosas son difíciles,
            pero siempre podras contar con nostros tkm.
                                            <span1> de yo</span1>
        </p>
 
      </div>

    </div>
  </div>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
